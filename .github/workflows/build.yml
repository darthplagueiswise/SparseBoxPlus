name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Install Swift 6.2 toolchain
        run: |
          set -euo pipefail
          URL="https://download.swift.org/swift-6.2-release/xcode/swift-6.2-RELEASE/swift-6.2-RELEASE-osx.pkg"
          echo "Downloading Swift 6.2 toolchain..."
          curl -L -f -o swift-6.2-RELEASE-osx.pkg "$URL"
          echo "Installing Swift 6.2 toolchain..."
          sudo installer -pkg swift-6.2-RELEASE-osx.pkg -target /\
          rm -f swift-6.2-RELEASE-osx.pkg
          echo "Swift installed; verifying:"
          swift --version
          echo "TOOLCHAINS=swift" >> "$GITHUB_ENV"

      - name: Build
        run: |
          xcodebuild -scheme SparseBox -derivedDataPath build -destination 'generic/platform=iOS' CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
          mkdir -p Payload packages
          cp -R build/Build/Products/Debug-iphoneos/SparseBox.app Payload/
          zip -r packages/SparseBox.ipa Payload
          rm -rf Payload

      - name: Upload artifact
        uses: actions/upload-artifact@main
        with:
          name: artifact
          path: packages/*.ipa
